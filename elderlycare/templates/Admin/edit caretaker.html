<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
</head>

<body>
{% extends 'Admin/home.html' %}

{% block body %}
<form id="form1" name="form1" method="post" enctype="multipart/form-data" action="/my_project/edit_caretaker_post/">
{% csrf_token %}
    <table class="table table-bordered" style="width: 700px;">
    <tr>
      <th>Name </th><input type="hidden" name="id" value="{{ data.id }}">
      <td><label for="textfield"></label>
      <input type="text"class="form-control" value="{{ data.caretaker_Name }}" reqired name="textfield" id="textfield" /></td>
    </tr>
      <tr>
      <th>Gender</th>
      <td><label for="textfield2"></label>
      <input type="radio" name="gender" value="Male" {% if data.gender == "Male" %}checked{% endif %} id="textfield2" />Male<br>
      <input type="radio" name="gender" value="Female" {% if data.gender == "Female" %}checked{% endif %} id="textfield2" />Female
      </td>
    </tr>
    <tr>
      <th>Place </th>
      <td><label for="textfield2"></label>
      <input type="text"class="form-control" required value="{{ data.gender }}" name="textfield2" id="textfield2" /></td>
    </tr>
    <tr>
      <th>Phone </th>
      <td><label for="textfield3"></label>
      <input type="text"class="form-control" required value="{{ data.phone }}" name="textfield3" id="textfield3" /></td>
    </tr>
    <tr>
      <th>Email</th>
      <td><label for="textfield4"></label>
      <input type="email"class="form-control" required value="{{ data.email }}" name="textfield4" id="textfield4" /></td>
    </tr>
    <tr>
      <th>Post</th>
      <td><label for="textfield5"></label>
      <input type="text"class="form-control" required value="{{ data.post }}" name="textfield5" id="textfield5" /></td>
    </tr>
    <tr>
      <th>Pin</th>
      <td><label for="textfield6"></label>
      <input type="text"class="form-control"required value="{{ data.pin }}" name="textfield6" id="textfield6" /></td>
    </tr>
    <tr>
      <th>District </th>
      <td><label for="textfield7"></label>
      <input type="text"class="form-control" required value="{{ data.district }}" name="textfield7" id="textfield7" /></td>
    </tr>
    <tr>
      <th>DOB</th>
      <td><label for="textfield8"></label>
      <input type="date"class="form-control" required value="{{ data.DOB|date:'Y-m-d' }}" name="textfield8" id="textfield8" /></td>
    </tr>
    <tr>
      <th>Photo</th>
      <td><label for="textfield9"></label>
          <img src="{{ data.photo }}" height="100px" width="100px" alt=""/>
      <input type="file" class="form-control" name="textfield9" id="textfield9" /></td>
    </tr>
            <tr>
      <th>Country</th>
      <td><label for="textfield3"></label>
      <input type="text"class="form-control" required value="{{ data.country }}" name="textfield13" id="textfield3" /></td>
    </tr>


    <tr>
      <td>&nbsp;</td>
      <td><input type="submit"class="btn btn-success" name="button" id="button" value="Change" /></td>
    </tr>
  </table>
</form>
{% endblock %}
</body>
</html>
