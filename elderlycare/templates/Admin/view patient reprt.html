<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<body>
{% extends 'Admin/home.html' %}

{% block body %}
<form id="form1" name="form1" method="post" action="/my_project/view_patient_reprt_post/#ec">
    {% csrf_token %}
  <table class="px pull-left" >
    <tr>
      <td>From</td>
      <td><label for="textfield"></label>
      <input type="date"class="form-control" name="textfield" id="textfield" /></td>
      <td>To </td>
      <td><label for="textfield2"></label>
      <input type="date"class="form-control" name="textfield2" id="textfield2" /></td>
      <td><input type="submit"class="btn-success" name="button" id="button" value="Search" /></td>
    </tr>
  </table>
  <table class="table table-bordered" style="width: 700px;">
    <tr>
      <th>S/No</th>
        <th>Title</th>
      <th>Date</th>
      <th>Time</th>
        <th>Result</th>
    </tr>
{% for i in data %}
    <tr>
      <td>{{ forloop.counter }}</td>
      <td>{{ i.title }}  </td>
      <td>{{ i.date }}</td>
      <td>{{ i.time }}</td>
    <td>{{ i.result }}</td>
    </tr>
      {% endfor %}
  </table>
</form>
{% endblock %}
</body>
